[package]
name = "caligrama"
version = "0.3.0"
edition = "2021"
description = "Escribe un poema dentro de la silueta de una imagen y lo devuelve como texto. Núcleo en Rust de la librería de Python caligrama."
license = "MIT"
authors = ["Mao Suarez <maosuarezbarrer@gmail.com>"]
repository = "https://github.com/maosuarez/caligrama"
readme = "README.md"
keywords = ["calligram", "ascii-art", "poetry", "text-art", "pyo3"]
categories = ["text-processing", "multimedia::images", "command-line-utilities"]
exclude = ["live-test/", "assets/", ".github/"]

[lib]
name = "caligrama"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
unicode-segmentation = "1.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
